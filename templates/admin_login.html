<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ELEN AI Admin · Login</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090f18;color:#e8eef7}.box{width:min(400px,calc(100vw - 32px));padding:34px;background:#111b28;border:1px solid #29394c;border-radius:18px;box-shadow:0 24px 70px #0005}small{color:#67d8c8;letter-spacing:.15em;font-weight:700}h1{font-size:27px;margin:12px 0 8px}p{color:#94a5ba;margin:0 0 30px}label{display:block;font-size:13px;margin-bottom:8px;color:#c5d2e0}input{width:100%;padding:13px 14px;border:1px solid #34465b;border-radius:9px;background:#0b1420;color:#fff;font:inherit}button{width:100%;border:0;border-radius:9px;background:#58d5bf;color:#06120f;padding:13px;font:inherit;font-weight:700;margin-top:18px;cursor:pointer}.error{color:#ff9b9b;margin-top:16px}
</style></head><body><main class="box"><small>ELEN AI / ADMIN</small><h1>Вход в панель</h1><p>Введите пароль администратора.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button type="submit">Войти</button></form>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}</main></body></html>
