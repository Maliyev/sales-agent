<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELEN AI — чаты</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #0b1018;
      color: #e8edf5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1018; }
    button, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: 330px 1fr; height: 100vh; }
    .sidebar { border-right: 1px solid #273243; background: #111824; overflow: hidden; display: flex; flex-direction: column; }
    .brand { padding: 22px 20px 16px; border-bottom: 1px solid #273243; }
    .brand h1 { margin: 0; font-size: 19px; }
    .brand p { margin: 7px 0 0; color: #8fa0b7; font-size: 13px; }
    .sessions { overflow-y: auto; padding: 8px; }
    .session { width: 100%; border: 0; border-radius: 11px; padding: 13px 12px; margin-bottom: 4px; text-align: left; background: transparent; color: inherit; cursor: pointer; }
    .session:hover { background: #192334; }
    .session.active { background: #20314a; }
    .session-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .session-id { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { color: #8fa0b7; font-size: 12px; }
    .preview { margin-top: 6px; color: #8fa0b7; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat { min-width: 0; display: grid; grid-template-rows: auto 1fr auto; }
    .chat-header { padding: 18px 22px; border-bottom: 1px solid #273243; background: #0f1621; }
    .chat-header strong { display: block; }
    .chat-header span { color: #8fa0b7; font-size: 13px; }
    .messages { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
    .empty { margin: auto; color: #8fa0b7; text-align: center; }
    .bubble { max-width: min(720px, 82%); padding: 11px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
    .bubble.user { align-self: flex-start; background: #1b2637; border-bottom-left-radius: 4px; }
    .bubble.model { align-self: flex-end; background: #165f50; border-bottom-right-radius: 4px; }
    .message-id { display: block; margin-top: 5px; opacity: .55; font-size: 10px; }
    .composer { border-top: 1px solid #273243; padding: 15px 20px; background: #0f1621; }
    .composer-row { display: flex; gap: 10px; align-items: flex-end; }
    textarea { flex: 1; min-height: 48px; max-height: 150px; resize: vertical; border: 1px solid #334158; border-radius: 12px; background: #141d2a; color: #f4f7fb; padding: 12px; outline: none; }
    textarea:focus { border-color: #35b99d; }
    .send { border: 0; border-radius: 11px; background: #32a98f; color: #07130f; font-weight: 750; padding: 13px 18px; cursor: pointer; }
    .send:disabled { opacity: .45; cursor: not-allowed; }
    .status { min-height: 20px; margin-top: 7px; color: #8fa0b7; font-size: 12px; }
    .status.error { color: #ff8c8c; }
    @media (max-width: 760px) {
      .app { grid-template-columns: 130px 1fr; }
      .brand { padding: 16px 10px; }
      .brand p, .preview, .count { display: none; }
      .session { padding: 11px 8px; }
      .session-id { font-size: 12px; }
      .messages { padding: 14px; }
      .bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>ELEN AI</h1>
        <p id="sessionCount">Загрузка сессий…</p>
      </div>
      <div class="sessions" id="sessions"></div>
    </aside>

    <section class="chat">
      <header class="chat-header">
        <strong id="chatTitle">Выберите сессию</strong>
        <span id="chatSubtitle">Сообщения обновляются автоматически</span>
      </header>
      <div class="messages" id="messages">
        <div class="empty">Выберите чат слева</div>
      </div>
      <form class="composer" id="composer">
        <div class="composer-row">
          <textarea id="messageInput" maxlength="4000" placeholder="Ответить клиенту…" disabled></textarea>
          <button class="send" id="sendButton" type="submit" disabled>Отправить</button>
        </div>
        <div class="status" id="status"></div>
      </form>
    </section>
  </main>

  <script>
    const sessionsElement = document.getElementById("sessions");
    const messagesElement = document.getElementById("messages");
    const sessionCountElement = document.getElementById("sessionCount");
    const titleElement = document.getElementById("chatTitle");
    const subtitleElement = document.getElementById("chatSubtitle");
    const composer = document.getElementById("composer");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusElement = document.getElementById("status");

    let sessions = [];
    let selectedSession = null;
    let renderedSignature = "";

    function canSend(sessionId) {
      return sessionId.startsWith("whatsapp:") || sessionId.startsWith("telegram:");
    }

    function setStatus(text, isError = false) {
      statusElement.textContent = text;
      statusElement.classList.toggle("error", isError);
    }

    async function loadSessions() {
      try {
        const response = await fetch("/api/sessions", { cache: "no-store" });
        if (!response.ok) throw new Error("Не удалось загрузить сессии.");
        sessions = (await response.json()).sessions;
        sessionCountElement.textContent = `${sessions.length} сессий`;
        renderSessions();
        if (!selectedSession && sessions.length) selectSession(sessions[0].session_id);
      } catch (error) {
        sessionCountElement.textContent = "Нет соединения";
      }
    }

    function renderSessions() {
      sessionsElement.replaceChildren();
      for (const session of sessions) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "session" + (session.session_id === selectedSession ? " active" : "");
        button.addEventListener("click", () => selectSession(session.session_id));

        const top = document.createElement("div");
        top.className = "session-top";
        const id = document.createElement("span");
        id.className = "session-id";
        id.textContent = session.session_id;
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = session.message_count;
        top.append(id, count);

        const preview = document.createElement("div");
        preview.className = "preview";
        preview.textContent = session.last_text || "Пустая история";
        button.append(top, preview);
        sessionsElement.append(button);
      }
    }

    function selectSession(sessionId) {
      selectedSession = sessionId;
      renderedSignature = "";
      titleElement.textContent = sessionId;
      const supported = canSend(sessionId);
      subtitleElement.textContent = supported
        ? "Онлайн · обновление раз в секунду"
        : "Просмотр истории · отправка для этого канала недоступна";
      input.disabled = !supported;
      sendButton.disabled = !supported;
      setStatus("");
      renderSessions();
      loadMessages(true);
    }

    async function loadMessages(forceScroll = false) {
      if (!selectedSession) return;
      const requestedSession = selectedSession;
      try {
        const response = await fetch(
          `/api/sessions/${encodeURIComponent(requestedSession)}/messages`,
          { cache: "no-store" }
        );
        if (!response.ok) throw new Error("Не удалось загрузить сообщения.");
        const messages = (await response.json()).messages;
        if (requestedSession !== selectedSession) return;

        const signature = messages.map(message => message.id).join(",");
        if (signature === renderedSignature) return;

        const wasNearBottom = messagesElement.scrollHeight - messagesElement.scrollTop - messagesElement.clientHeight < 90;
        renderedSignature = signature;
        messagesElement.replaceChildren();

        if (!messages.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "В этой сессии пока нет сообщений";
          messagesElement.append(empty);
          return;
        }

        for (const message of messages) {
          const bubble = document.createElement("div");
          bubble.className = `bubble ${message.role}`;
          bubble.textContent = message.text;
          const messageId = document.createElement("span");
          messageId.className = "message-id";
          messageId.textContent = `#${message.id}`;
          bubble.append(messageId);
          messagesElement.append(bubble);
        }

        if (forceScroll || wasNearBottom) messagesElement.scrollTop = messagesElement.scrollHeight;
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    composer.addEventListener("submit", async event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!selectedSession || !text || !canSend(selectedSession)) return;

      input.disabled = true;
      sendButton.disabled = true;
      setStatus("Отправка…");
      try {
        const response = await fetch(
          `/api/sessions/${encodeURIComponent(selectedSession)}/messages`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
          }
        );
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Не удалось отправить сообщение.");
        input.value = "";
        setStatus("Отправлено");
        await loadMessages(true);
        await loadSessions();
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        const supported = selectedSession && canSend(selectedSession);
        input.disabled = !supported;
        sendButton.disabled = !supported;
        if (supported) input.focus();
      }
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    loadSessions();
    setInterval(loadSessions, 2000);
    setInterval(() => loadMessages(false), 1000);
  </script>
</body>
</html>
